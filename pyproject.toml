[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foveated-lidar-sih"
version = "0.1.0"
description = "Foveated Semantic 2.5D LiDAR Mapping for Autonomous Navigation (SIH 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vedant", email = "vedant@example.com" },
    { name = "Amulya", email = "amulya@example.com" },
    { name = "Manashri", email = "manashri@example.com" },
    { name = "Heet", email = "heet@example.com" },
    { name = "Atharva", email = "atharva@example.com" },
    { name = "Himisha", email = "himisha@example.com" }
]
keywords = [
    "lidar",
    "foveated-mapping",
    "point-cloud",
    "semantic-segmentation",
    "elevation-map",
    "autonomous-navigation",
    "sih2026"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
