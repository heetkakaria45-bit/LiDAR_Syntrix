[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foveated-semantic-lidar-mapping"
version = "0.1.0"
description = "Foveated Semantic 2.5D LiDAR Mapping for Autonomous Navigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
